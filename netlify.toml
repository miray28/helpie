[build]
  command = "echo 'No build step: static assets are served from public/'"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # Templates are read from disk at runtime, so they must be shipped explicitly.
  included_files = ["views/**"]
  # Shipped as regular node_modules rather than inlined into the bundle.
  external_node_modules = ["express", "ejs", "express-session", "helmet", "multer", "bcryptjs", "pg", "serverless-http", "@netlify/blobs", "@netlify/database"]
